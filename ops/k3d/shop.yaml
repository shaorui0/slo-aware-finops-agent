apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-steady
  namespace: shop
spec:
  replicas: 3                       # same as the synthetic world's shop/api-steady (testenv/k8s_world.yaml), so a generated plan's `before` matches
  selector:
    matchLabels: {app: api-steady}
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}   # one node: no room for a surge pod of 1 core / 2Gi
  template:
    metadata:
      labels: {app: api-steady}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app                  # container name, requests and limits below are copied from the synthetic world's api-steady
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/app.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          # over-provisioned on purpose: real need is ~0.15 core and ~0.9 GiB (the synthetic world), far less here
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: demo-scripts}
---
apiVersion: v1
kind: Service
metadata:
  name: api-steady
  namespace: shop
spec:
  selector: {app: api-steady}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  strategy: {type: Recreate}   # never two generators at once
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: loadgen
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/loadgen.py"]
          env:
            - {name: RPS, value: "5"}
            - {name: WORKERS, value: "16"}
            - {name: TARGET, value: "http://api-steady:8080/"}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: "2", memory: 256Mi}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: demo-scripts}
