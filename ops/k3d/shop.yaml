apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-steady
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-steady}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: api-steady}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/app.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          # over-provisioned on purpose: real need is ~0.1 core at normal load
          resources:
            requests: {cpu: 500m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: demo-scripts}
---
apiVersion: v1
kind: Service
metadata:
  name: api-steady
  namespace: shop
spec:
  selector: {app: api-steady}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen}
  strategy: {type: Recreate}   # never two generators at once
  template:
    metadata:
      labels: {app: loadgen}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: loadgen
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/loadgen.py"]
          env:
            - {name: RPS, value: "5"}
            - {name: TARGET, value: "http://api-steady:8080/"}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: demo-scripts}
