name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: make check
        env:
          # "" = rules + leak checks only; "1" also runs the docs checks (links, Chinese headings). Flip to "1" once the docs rewrite is merged.
          DOCS_CHECK: "1"
      - run: make test
      - run: make alerts-test
      - run: make eval AWS_PORT=14566 PROM_PORT=19090 RUN=ci
        env:
          FINOPS_LLM_MODE: replay   # committed cassettes in eval/cassettes/: no network, no API key
      - run: make k8s-eval K8S_PORT=19190
        env:
          FINOPS_LLM_MODE: replay   # every narrative prompt has a committed cassette; a missing one fails the step
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: |
            runs/ci/
            runs/k8s-local/
